<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wreckborn</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1d2a; overflow: hidden; font: 13px/1.4 monospace; color: #f4ead0; }
  #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; }
  .panel { position: fixed; background: rgba(10,20,30,.9); border: 1px solid #e8d48b; padding: 8px 10px; z-index: 5; }
  #status { top: 8px; right: 8px; width: 230px; }
  .meter { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .meter span { width: 52px; }
  .track { flex: 1; height: 8px; background: #22313d; }
  .fill { height: 100%; }
  #clock { margin-top: 4px; font-size: 12px; opacity: .9; }
  #hotbar-wrap { bottom: 8px; left: 50%; transform: translateX(-50%); text-align: center; }
  #hotbar { display: flex; gap: 4px; }
  .slot { position: relative; width: 34px; height: 34px; background: #22313d; border: 2px solid #22313d; }
  .slot.selected { border-color: #f4ead0; }
  .slot .swatch { position: absolute; inset: 8px; }
  .slot .key { position: absolute; top: 0; left: 2px; font-size: 9px; opacity: .6; }
  .slot .count { position: absolute; bottom: 0; right: 2px; font-size: 11px; text-shadow: 1px 1px #000; }
  #selected-name { min-height: 16px; font-size: 12px; margin-bottom: 4px; }
  #hint { bottom: 76px; left: 50%; transform: translateX(-50%); display: none; }
  #toast { position: fixed; top: 40%; left: 50%; transform: translateX(-50%); background: rgba(10,20,30,.85);
    padding: 6px 12px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 6; max-width: 80vw; text-align: center; }
  #help { bottom: 8px; left: 8px; font-size: 11px; opacity: .8; }
  #craft { top: 50%; left: 50%; transform: translate(-50%,-50%); width: 340px; max-height: 80vh; overflow: auto; display: none; z-index: 8; }
  #craft button { display: block; width: 100%; margin: 5px 0; text-align: left; font: inherit; color: #f4ead0;
    background: #2a6f97; border: 0; padding: 6px 8px; cursor: pointer; }
  #craft button.disabled { background: #33414c; color: #9aa4ab; }
  #craft .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
  #debug { position: fixed; top: 8px; left: 8px; background: rgba(10,20,30,.95); padding: 10px; width: 270px;
    border: 1px solid #e8d48b; display: none; z-index: 10; }
  #debug .section { margin-top: 8px; opacity: .7; font-size: 11px; text-transform: uppercase; }
  #debug .row { display: flex; gap: 4px; align-items: center; margin: 3px 0; }
  #debug .row label { width: 52px; }
  #debug .row input[type=range], #debug select { flex: 1; }
  #debug button { font: inherit; background: #2a6f97; color: #fff; border: 0; padding: 3px 6px; cursor: pointer; }
  #debug button:hover { background: #3c8bb8; }
</style>
</head>
<body>
<div id="game"></div>
<div id="status" class="panel"><div id="meters"></div><div id="clock"></div></div>
<div id="hotbar-wrap" class="panel"><div id="selected-name"></div><div id="hotbar"></div></div>
<div id="hint" class="panel"></div>
<div id="toast"></div>
<div id="help" class="panel">WASD move · E gather/sleep/place · Q eat · 1–0 select · C craft</div>
<div id="craft" class="panel"></div>
<div id="debug"></div>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
